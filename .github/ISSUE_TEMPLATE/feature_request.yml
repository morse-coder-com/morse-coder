name: Feature request
description: Suggest a product improvement.
title: "[Feature]: "
labels: ["type: feature", "status: needs triage"]
body:
  - type: textarea
    id: request
    attributes:
      label: What should Morse Coder improve?
      description: Describe the workflow or learning use case.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why would this help?
      description: Explain who benefits and how often they would use it.
    validations:
      required: true
